<div class="nueva">
  <header class="nueva__header">
    <img class="nueva__logo" src="logoHeader.png" alt="Logo RECRED" />
    <span class="nueva__marca">RECRED</span>
  </header>

  <main class="nueva__hero">
    <section class="nueva__card" aria-labelledby="nueva-titulo">
      @if (!presenter.completado()) {
        <h1 id="nueva-titulo" class="nueva__titulo">Nueva contraseña</h1>
        <p class="nueva__subtitulo">
          Elegí una nueva contraseña para
          <strong>{{ presenter.email() }}</strong>.
        </p>

        <form
          class="nueva__form"
          novalidate
          (submit)="$event.preventDefault(); onSubmit()"
        >
          <app-login-text-field
            etiqueta="Nueva contraseña"
            tipo="password"
            autocomplete="new-password"
            placeholder="Mínimo 6 caracteres"
            [valor]="presenter.password()"
            (valorCambiado)="onPasswordChange($event)"
          />

          <app-login-text-field
            etiqueta="Repetir contraseña"
            tipo="password"
            autocomplete="new-password"
            placeholder="Repetí la contraseña"
            [valor]="presenter.confirmacion()"
            (valorCambiado)="onConfirmacionChange($event)"
          />

          @if (presenter.error(); as msg) {
            <p class="nueva__error" role="alert">{{ msg }}</p>
          }

          <app-login-submit-button
            texto="Guardar contraseña"
            textoCargando="Guardando…"
            [disabled]="!presenter.formValido()"
            [cargando]="presenter.cargando()"
            (clicked)="onSubmit()"
          />
        </form>

        <button type="button" class="nueva__volver" (click)="onVolver()">
          ← Volver al inicio
        </button>
      } @else {
        <div class="nueva__exito-icono" aria-hidden="true">✓</div>
        <h1
          id="nueva-titulo"
          class="nueva__titulo nueva__titulo--centrado"
        >
          Contraseña actualizada
        </h1>
        <p class="nueva__subtitulo nueva__subtitulo--centrado">
          Ya podés iniciar sesión con tu nueva contraseña.
        </p>

        <app-login-submit-button
          texto="Ir al login"
          [disabled]="false"
          [cargando]="false"
          (clicked)="onIrALogin()"
        />
      }
    </section>
  </main>
</div>
