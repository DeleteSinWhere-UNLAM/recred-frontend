<div class="registro">
  <header class="registro__header">
    <img class="registro__logo" src="logoHeader.png" alt="Logo RECRED" />
    <span class="registro__marca">RECRED</span>
  </header>

  <main class="registro__hero">
    <section class="registro__card" aria-labelledby="registro-titulo">
      <h1 id="registro-titulo" class="registro__titulo">Crear cuenta</h1>
      <p class="registro__subtitulo">
        Completá tus datos para empezar a usar RECRED.
      </p>

      <form
        class="registro__form"
        novalidate
        (submit)="$event.preventDefault(); onSubmit()"
      >
        <app-login-text-field
          etiqueta="Nombre y apellido"
          tipo="text"
          autocomplete="name"
          placeholder="Ej: María González"
          [valor]="presenter.nombreCompleto()"
          (valorCambiado)="onNombreChange($event)"
        />

        <app-login-text-field
          etiqueta="Email"
          tipo="email"
          autocomplete="email"
          placeholder="tu@email.com"
          [valor]="presenter.email()"
          (valorCambiado)="onEmailChange($event)"
        />

        <app-login-text-field
          etiqueta="Contraseña"
          tipo="password"
          autocomplete="new-password"
          placeholder="Mínimo 6 caracteres"
          [valor]="presenter.password()"
          (valorCambiado)="onPasswordChange($event)"
        />

        <app-login-text-field
          etiqueta="Teléfono"
          tipo="tel"
          autocomplete="tel"
          placeholder="Ej: 1145678901"
          [valor]="presenter.telefono()"
          (valorCambiado)="onTelefonoChange($event)"
        />

        <app-login-text-field
          etiqueta="Dirección"
          tipo="text"
          autocomplete="street-address"
          placeholder="Calle, número, localidad"
          [valor]="presenter.direccion()"
          (valorCambiado)="onDireccionChange($event)"
        />

        <app-registro-tipo-usuario-selector
          etiqueta="Tipo de cuenta"
          [valor]="presenter.tipoUsuario()"
          (valorCambiado)="onTipoUsuarioChange($event)"
        />

        @if (presenter.error(); as msg) {
          <p class="registro__error" role="alert">{{ msg }}</p>
        }

        <app-login-submit-button
          texto="Crear cuenta"
          textoCargando="Creando cuenta…"
          [disabled]="!presenter.formValido()"
          [cargando]="presenter.cargando()"
          (clicked)="onSubmit()"
        />
      </form>

      <p class="registro__login">
        ¿Ya tenés cuenta?
        <button type="button" class="registro__link" (click)="onIrALogin()">
          Iniciá sesión
        </button>
      </p>

      <button type="button" class="registro__volver" (click)="onVolver()">
        ← Volver al inicio
      </button>
    </section>
  </main>
</div>
