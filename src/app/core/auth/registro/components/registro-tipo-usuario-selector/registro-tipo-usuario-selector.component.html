<fieldset class="selector">
  <legend class="selector__etiqueta">{{ etiqueta }}</legend>
  <div class="selector__grupo" role="radiogroup">
    @for (op of opciones; track op.id) {
      <button
        type="button"
        class="selector__opcion"
        [class.selector__opcion--activo]="valor === op.id"
        [attr.aria-pressed]="valor === op.id"
        (click)="onSeleccionar(op.id)"
      >
        {{ op.label }}
      </button>
    }
  </div>
</fieldset>
