@if (isOpen) {
      <div class="fixed inset-0 z-50 flex items-center justify-center bg-texto-oscuro/60 backdrop-blur-sm">
        
        <div class="bg-fondo w-11/12 max-w-md rounded-xl shadow-2xl p-6 animate-fade-in-up">
          
          <h2 class="text-2xl font-bold text-pizarra mb-3">
            {{ title }}
          </h2>
          
          <p class="text-texto-oscuro text-base leading-relaxed mb-6">
            {{ message }}
          </p>
          
          <div class="flex justify-end gap-3">
            @if (showCancel) {
              <app-button-component variant="outline" (onClick)="dismiss.emit()">
                {{ cancelText }}
              </app-button-component>
            }
            <app-button-component variant="success" (onClick)="confirm.emit()">
              {{ confirmText }}
            </app-button-component>
          </div>

        </div>
      </div>
    }
