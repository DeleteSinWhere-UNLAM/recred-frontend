@if (isOpen) {
  <div class="modal__overlay">
    <div class="modal__dialog" [class]="customClass">
      <h2 class="modal__title">
        {{ title }}
      </h2>

      <div class="modal__message">
        @if (message) {
          <p>{{ message }}</p>
        }
        <ng-content></ng-content>
      </div>

      <div class="modal__acciones">
        @if (showCancel) {
          <app-button-component variant="outline" (Click)="dismiss.emit()">
            {{ cancelText }}
          </app-button-component>
        }
        <app-button-component [variant]="confirmVariant" (Click)="confirm.emit()">
          {{ confirmText }}
        </app-button-component>
      </div>
    </div>
  </div>
}
