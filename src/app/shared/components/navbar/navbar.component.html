<header class="navbar">
  <div class="navbar__inner">
    <div class="navbar__brand">
      <a class="navbar__logo" href="/" (click)="irAInicio($event)" aria-label="RECRED — Inicio">
        <img src="logoHeader.png" alt="" class="navbar__logo-img">
        <span class="navbar__logo-text">RECRED</span>
      </a>
      @if (!esVistaAlumno()) {
        <span class="navbar__divider" aria-hidden="true"></span>
        <span class="navbar__greeting">Hola, {{ userName }}</span>
      }
    </div>

    <nav class="navbar__actions" aria-label="Acciones principales">
      <div class="navbar__perfil-wrap">
        <button
          type="button"
          class="navbar__perfil"
          aria-label="Mi perfil"
          [attr.aria-expanded]="menuAbierto()"
          aria-haspopup="menu"
          (click)="toggleMenu()"
        >
          <i class="fa-solid fa-user" aria-hidden="true"></i>
        </button>
        @if (menuAbierto()) {
          <div class="navbar__menu" role="menu">
            <button
              type="button"
              class="navbar__menu-item"
              role="menuitem"
              (click)="cerrarSesion()"
            >
              <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
              <span>Cerrar sesión</span>
            </button>
          </div>
        }
      </div>
      <button
        type="button"
        class="navbar__cart"
        (click)="irAlCarrito()"
        [attr.aria-label]="'Carrito, ' + cartCount() + ' ítems'"
      >
        <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
        @if (cartCount() > 0) {
          <span class="navbar__cart-badge">{{ cartCount() }}</span>
        }
      </button>
    </nav>
  </div>
</header>
