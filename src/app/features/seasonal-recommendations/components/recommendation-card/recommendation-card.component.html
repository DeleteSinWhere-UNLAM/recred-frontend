<article class="recommendation-card" [ngClass]="'recommendation-card--' + item.accion.toLowerCase()">
  <header class="recommendation-card__header">
    <h4 class="recommendation-card__titulo">{{ item.categoria }}</h4>
    <span class="recommendation-card__badge" [ngClass]="'recommendation-card__badge--' + item.accion.toLowerCase()">
      @if (item.accion === 'AUMENTAR') {
        <i class="fa-solid fa-arrow-up" aria-hidden="true"></i> Aumentar
      } @else if (item.accion === 'REDUCIR') {
        <i class="fa-solid fa-arrow-down" aria-hidden="true"></i> Reducir
      } @else {
        <i class="fa-solid fa-minus" aria-hidden="true"></i> {{ item.accion }}
      }
    </span>
  </header>
  <p class="recommendation-card__motivo">{{ item.motivo }}</p>
</article>
