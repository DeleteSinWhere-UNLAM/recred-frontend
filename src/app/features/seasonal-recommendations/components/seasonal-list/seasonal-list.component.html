<div class="seasonal-list">
  @if (tipPromocional) {
    <app-tip-card [tipPromocional]="tipPromocional"></app-tip-card>
  }

  @if (sugerencias.length > 0) {
    <section class="seasonal-list__panel" aria-labelledby="sugerencias-titulo">
      <h3 id="sugerencias-titulo" class="seasonal-list__titulo">
        Sugerencias de stock
      </h3>
      <div class="seasonal-list__grid">
        @for (item of sugerencias; track item.categoria) {
          <app-recommendation-card [item]="item"></app-recommendation-card>
        }
      </div>
    </section>
  } @else {
    <p class="seasonal-list__vacio">
      No hay sugerencias disponibles en tu zona para esta temporada.
    </p>
  }
</div>
