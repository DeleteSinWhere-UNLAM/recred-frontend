<div
  class="mensaje-burbuja"
  [class.mensaje-burbuja--usuario]="esUsuario"
  [class.mensaje-burbuja--cred]="!esUsuario"
>
  @if (!esUsuario) {
    <div class="mensaje-burbuja__avatar" aria-hidden="true">🤖</div>
  }
  <div class="mensaje-burbuja__contenido">
    <p class="mensaje-burbuja__texto">{{ mensaje.texto }}</p>
    <span class="mensaje-burbuja__hora">{{ horaFormateada }}</span>
  </div>
</div>
