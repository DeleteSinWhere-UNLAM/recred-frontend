<button
  type="button"
  class="asistente-fab"
  [class.asistente-fab--oculto]="oculto"
  (click)="onClick()"
  aria-label="Abrir asistente Cred"
>
  <span class="asistente-fab__halo" aria-hidden="true"></span>
  <span class="asistente-fab__emoji" aria-hidden="true">🤖</span>
  @if (mostrarBadge && !oculto) {
    <span class="asistente-fab__badge" aria-hidden="true">¡hola!</span>
  }
</button>
