<form class="input-mensaje" (submit)="onSubmit($event)">
  @if (mostrarAcciones) {
    <button
      type="button"
      class="input-mensaje__acciones"
      [class.input-mensaje__acciones--abiertas]="accionesAbiertas"
      [attr.aria-expanded]="accionesAbiertas"
      aria-controls="asistente-panel-acciones"
      aria-label="Ver opciones del asistente"
      title="Ver opciones"
      (click)="onAlternarAcciones()"
    >
      <i class="fa-solid fa-list-check" aria-hidden="true"></i>
      <span>Acciones</span>
    </button>
  }

  <input
    #inputEl
    type="text"
    class="input-mensaje__campo"
    placeholder="Escribí tu pregunta..."
    autocomplete="off"
    maxlength="280"
    [disabled]="deshabilitado"
    [ngModel]="texto()"
    (ngModelChange)="texto.set($event)"
    name="mensaje-asistente"
    aria-label="Tu pregunta para Cred"
  />
  <button
    type="submit"
    class="input-mensaje__enviar"
    [disabled]="!puedeEnviar"
    aria-label="Enviar mensaje"
  >
    <span aria-hidden="true">➤</span>
  </button>
</form>
