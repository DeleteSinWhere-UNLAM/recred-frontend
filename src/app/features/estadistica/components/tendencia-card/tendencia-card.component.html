<div class="tendencia-card">
  <div class="tendencia-card__header">
    <h3 class="tendencia-card__title">Tendencia de Gastos</h3>
  </div>

  <div class="tendencia-card__chart-container">
    @if (historial.length > 0 && lineChartData.labels && lineChartData.labels.length > 0) {
      <canvas 
        baseChart 
        [data]="lineChartData" 
        [options]="lineChartOptions" 
        [type]="lineChartType">
      </canvas>
    } @else {
      <div class="tendencia-card__empty">
        <p>No hay suficientes datos de compras para mostrar la tendencia.</p>
      </div>
    }
  </div>
</div>
