<section class="perfil-header" [attr.aria-label]="'Perfil de ' + nombreCompleto">
  <img class="perfil-header__nube perfil-header__nube--uno" src="/nube.png" alt="" aria-hidden="true" />
  <img class="perfil-header__nube perfil-header__nube--dos" src="/nube.png" alt="" aria-hidden="true" />
  <img class="perfil-header__nube perfil-header__nube--tres" src="/nube.png" alt="" aria-hidden="true" />

  <div class="perfil-header__avatar-wrap">
    <div class="perfil-header__avatar">
      @if (urlFotoPerfil) {
        <img [src]="urlFotoPerfil" [alt]="'Foto de ' + nombreCompleto" class="perfil-header__avatar-img" />
      } @else {
        <span>{{ iniciales }}</span>
      }
    </div>
    <span class="perfil-header__avatar-emoji" aria-hidden="true">😊</span>
  </div>

  <div class="perfil-header__info">
    <p class="perfil-header__saludo">
      <span class="perfil-header__saludo-mano" aria-hidden="true">👋</span>
      ¡Hola,
    </p>
    <h1 class="perfil-header__nombre">{{ nombreCompleto }}!</h1>
    <p class="perfil-header__subtitulo">
      <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
      <span>{{ grado }} · {{ colegio }}</span>
    </p>
  </div>

  <div
    class="perfil-header__saldo"
    [class.perfil-header__saldo--negativo]="saldoNegativo"
  >
    <span class="perfil-header__saldo-label">
      <i class="fa-solid fa-wallet" aria-hidden="true"></i>
      Tu saldo
    </span>
    <span class="perfil-header__saldo-valor">{{ saldoFormateado }}</span>
  </div>
</section>
