<div class="smart-card">
  <div class="smart-card-header">
    <i class="fa-solid fa-grip-vertical drag-handler" style="cursor: grab; margin-right: 12px; color: #ffffff; font-size: 1.2rem;" title="Arrastrar tarjeta"></i>
    <div class="header-controls">
      <select class="custom-select child-select" [(ngModel)]="selectedChildId" (change)="onConfigChange()">
        @for (child of children; track child.studentId) {
          <option [value]="child.studentId">
            {{ child.studentName }}
          </option>
        }
      </select>

      <select class="custom-select metric-select" [(ngModel)]="selectedDataSource" (change)="onConfigChange()">
        <option value="finance">Finanzas</option>
        <option value="health">Salud</option>
        <option value="logistics">Logística</option>
      </select>

      <select class="custom-select type-select" [(ngModel)]="selectedChartType" (change)="onConfigChange()">
        <option value="bar">Barras</option>
        <option value="line">Línea</option>
        <option value="pie">Torta</option>
        <option value="doughnut">Rosca</option>
      </select>
    </div>
  </div>

  <div class="smart-card-body">
    <canvas baseChart
      [data]="chartData"
      [options]="chartOptions"
      [type]="selectedChartType">
    </canvas>
  </div>
</div>
