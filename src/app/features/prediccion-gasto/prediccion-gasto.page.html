<app-navbar />

<main class="prediccion-gasto-page">
  <button
    type="button"
    class="prediccion-gasto-page__volver"
    (click)="volver()"
  >
    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
    <span>Volver</span>
  </button>

  <div class="prediccion-gasto-page__container">
    <header class="prediccion-gasto-page__cabecera">
      <div class="prediccion-gasto-page__icono" aria-hidden="true">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </div>
      <div class="prediccion-gasto-page__identidad">
        <h2 class="prediccion-gasto-page__titulo">Predicción</h2>
        <p class="prediccion-gasto-page__subtitulo">
          Comportamiento de consumo y proyección de gastos
        </p>
      </div>
    </header>

    @if (isLoading) {
      <section class="prediccion-gasto-page__estado">
        <div class="prediccion-gasto-page__spinner" aria-hidden="true"></div>
        <p>Analizando tus consumos…</p>
      </section>
    }

    @if (errorMessage && !isLoading) {
      <section class="prediccion-gasto-page__estado prediccion-gasto-page__estado--error">
        <div class="prediccion-gasto-page__error-icono" aria-hidden="true">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <p>{{ errorMessage }}</p>
        <button type="button" class="prediccion-gasto-page__reintentar" (click)="ngOnInit()">
          Reintentar
        </button>
      </section>
    }

    @if (predictionData && !isLoading) {
      <app-resumen-prediccion
        [periodo]="predictionData.periodo"
        [fechaCalculo]="predictionData.fechaCalculo"
        [fechaInicio]="predictionData.fechaInicio"
        [fechaFin]="predictionData.fechaFin"
        [gastoActual]="predictionData.gastoActual"
        [gastoPredicho]="predictionData.gastoPredicho"
        [promedioGastoDiario]="predictionData.promedioGastoDiario"
        [montoLimite]="predictionData.montoLimite"
        [porcentajePresupuesto]="predictionData.porcentajePresupuesto"
        [confianza]="predictionData.confianza"
        [diasHistoricosUsados]="predictionData.diasHistoricosUsados"
        [diasRestantes]="predictionData.diasRestantes">
      </app-resumen-prediccion>

      <app-analisis-prediccion
        [analisisIa]="predictionData.analisisIa"
        [categoriasMasConsumidas]="predictionData.categoriasMasConsumidas">
      </app-analisis-prediccion>
    }
  </div>
</main>
