<app-navbar />

<main class="inventario">
  <button
    type="button"
    class="inventario__volver"
    (click)="volver()"
  >
    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
    <span>Volver</span>
  </button>

  <div class="inventario__container">
    <header class="inventario__cabecera">
      <div class="inventario__icono" aria-hidden="true">
        <i class="fa-solid fa-boxes-stacked"></i>
      </div>
      <div class="inventario__identidad">
        <h2 class="inventario__titulo">Inventario</h2>
        <p class="inventario__subtitulo">
          Gestiona el stock de tu kiosco
        </p>
      </div>
      <button
        type="button"
        class="inventario__nuevo"
        (click)="openCreateForm()"
      >
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
        <span>Nuevo producto</span>
      </button>
    </header>

    <app-product-table
      [products]="products"
      [isLoading]="isLoading"
      (edit)="openEditForm($event)"
      (remove)="requestDelete($event)">
    </app-product-table>

    @if (isFormVisible) {
      <app-product-form
        [product]="selectedProduct"
        [categories]="categories"
        [isSaving]="isSaving"
        (formSubmit)="handleFormSubmit($event)"
        (formCancel)="closeForm()">
      </app-product-form>
    }

    <app-confirm-delete-modal
      [isOpen]="deleteTarget !== null"
      [productName]="deleteTarget?.nombre ?? ''"
      (confirmed)="confirmDelete()"
      (cancelled)="cancelDelete()">
    </app-confirm-delete-modal>
  </div>
</main>
