<div
  class="bulk-upload-modal__backdrop"
  tabindex="0"
  role="button"
  (click)="onCancel()"
  (keydown.enter)="onCancel()"
  (keydown.space)="onCancel()"
>
  <section
    class="bulk-upload-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="bulk-upload-title"
    tabindex="-1"
    (click)="$event.stopPropagation()"
    (keydown.enter)="$event.stopPropagation()"
    (keydown.space)="$event.stopPropagation()"
  >
    <header class="bulk-upload-modal__header">
      <div>
        <h3 id="bulk-upload-title" class="bulk-upload-modal__titulo">
          Carga Masiva de Productos
        </h3>
        <p class="bulk-upload-modal__subtitle">
          Sube tu archivo y edita los datos antes de guardarlos
        </p>
      </div>
      <button
        type="button"
        class="bulk-upload-modal__close"
        (click)="onCancel()"
        aria-label="Cerrar"
      >
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </header>

    <div class="bulk-upload-modal__body">
      <div class="bulk-upload-modal__file-section">
        <label class="bulk-upload-modal__file-label">
          <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
          <span>Subir archivo PDF o Excel</span>
          <input
            type="file"
            class="bulk-upload-modal__file-input"
            accept=".pdf,.xlsx,.xls,.csv"
            (change)="onFileChange($event)"
            [disabled]="isProcessingFile"
          >
        </label>
        @if (isProcessingFile) {
          <span class="bulk-upload-modal__processing">
            <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
            Procesando archivo...
          </span>
        }
      </div>

      <form [formGroup]="form" class="bulk-upload-modal__form">
        <div class="bulk-upload-modal__table-container">
          <table class="bulk-upload-modal__table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Peso</th>
                <th>Categoría (Nueva)</th>
                <th>Prep.</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody formArrayName="products">
              @for (control of productsArray.controls; track $index) {
                <tr [formGroupName]="$index">
                  <td>
                    <input type="text" formControlName="nombre" placeholder="Nombre">
                  </td>
                  <td>
                    <input type="text" formControlName="descripcion" placeholder="Descripción">
                  </td>
                  <td>
                    <input type="number" formControlName="precio" min="0" step="10">
                  </td>
                  <td>
                    <input type="number" formControlName="stockActual" min="0" step="1">
                  </td>
                  <td>
                    <input type="number" formControlName="peso" min="0" step="0.1">
                  </td>
                  <td>
                    <input type="text" formControlName="nuevaCategoriaNombre" placeholder="Categoría">
                  </td>
                  <td>
                    <input type="checkbox" formControlName="requierePreparacion">
                  </td>
                  <td>
                    <button
                      type="button"
                      class="bulk-upload-modal__btn-delete"
                      (click)="removeProductRow($index)"
                      aria-label="Eliminar fila"
                    >
                      <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
                    </button>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
        <button
          type="button"
          class="bulk-upload-modal__btn-add"
          (click)="addProductRow()"
        >
          <i class="fa-solid fa-plus" aria-hidden="true"></i>
          Agregar fila
        </button>
      </form>
    </div>

    <footer class="bulk-upload-modal__footer">
      <button
        type="button"
        class="bulk-upload-modal__btn bulk-upload-modal__btn--cancel"
        (click)="onCancel()"
      >
        Cancelar
      </button>
      <button
        type="button"
        class="bulk-upload-modal__btn bulk-upload-modal__btn--submit"
        (click)="onSave()"
        [disabled]="isProcessingFile || productsArray.length === 0"
      >
        Guardar productos
      </button>
    </footer>
  </section>
</div>
