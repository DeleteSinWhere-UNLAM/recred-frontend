<app-navbar [userName]="nombreUsuario" />

<main class="crear-hijo">
  @if (tieneHijos()) {
    <div class="crear-hijo__topbar">
      <button
        type="button"
        class="crear-hijo__volver"
        (click)="onCancelar()"
        [disabled]="presenter.guardando()"
      >
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        <span>Volver</span>
      </button>
    </div>
  }

  <div class="crear-hijo__container">
    <header class="crear-hijo__header">
      <span class="crear-hijo__icono" aria-hidden="true">
        <i class="fa-solid fa-user-plus"></i>
      </span>
      <h1 class="crear-hijo__titulo">
        @if (tieneHijos()) {
          Agregar otro hijo
        } @else {
          Agregá a tu primer hijo
        }
      </h1>
      <p class="crear-hijo__bajada">
        Cargá los datos del alumno para asociarlo a tu cuenta. Luego va a poder
        ingresar con su propio usuario.
      </p>
    </header>

    <form
      class="crear-hijo__form"
      [formGroup]="form"
      (submit)="onSubmit($event)"
      novalidate
    >
      <div class="crear-hijo__grid">
        <label class="crear-hijo__field">
          <span class="crear-hijo__label">Nombre</span>
          <input
            type="text"
            formControlName="nombre"
            placeholder="Juan"
            autocomplete="given-name"
          />
          @if (form.controls.nombre.touched && form.controls.nombre.invalid) {
            <span class="crear-hijo__error">Ingresá el nombre del hijo.</span>
          }
        </label>

        <label class="crear-hijo__field">
          <span class="crear-hijo__label">Apellido</span>
          <input
            type="text"
            formControlName="apellido"
            placeholder="Pérez"
            autocomplete="family-name"
          />
          @if (
            form.controls.apellido.touched && form.controls.apellido.invalid
          ) {
            <span class="crear-hijo__error">Ingresá el apellido del hijo.</span>
          }
        </label>

        <label class="crear-hijo__field">
          <span class="crear-hijo__label">Usuario</span>
          <input
            type="text"
            formControlName="username"
            placeholder="juan.perez"
            autocomplete="username"
          />
          <span class="crear-hijo__hint">
            Lo va a usar para iniciar sesión. No puede tener formato de email.
          </span>
          @if (form.controls.username.touched && form.controls.username.invalid) {
            @if (form.controls.username.errors?.['emailFormat']) {
              <span class="crear-hijo__error">
                El usuario no puede ser un email.
              </span>
            } @else {
              <span class="crear-hijo__error">Ingresá un usuario.</span>
            }
          }
        </label>

        <label class="crear-hijo__field">
          <span class="crear-hijo__label">DNI</span>
          <input
            type="text"
            inputmode="numeric"
            formControlName="dni"
            placeholder="12345678"
          />
          @if (form.controls.dni.touched && form.controls.dni.invalid) {
            <span class="crear-hijo__error">
              Ingresá un DNI válido (sólo números).
            </span>
          }
        </label>

        <label class="crear-hijo__field crear-hijo__field--full">
          <span class="crear-hijo__label">Email</span>
          <input
            type="email"
            formControlName="email"
            placeholder="juan.perez@example.com"
            autocomplete="email"
          />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <span class="crear-hijo__error">Ingresá un email válido.</span>
          }
        </label>

        <label class="crear-hijo__field crear-hijo__field--full">
          <span class="crear-hijo__label">Colegio</span>
          <select formControlName="colegioId">
            <option value="" disabled>
              @if (presenter.cargandoColegios()) {
                Cargando colegios...
              } @else {
                Elegí un colegio
              }
            </option>
            @for (colegio of presenter.colegios(); track colegio.id) {
              <option [value]="colegio.id">{{ colegio.nombre }}</option>
            }
          </select>
          @if (
            form.controls.colegioId.touched && form.controls.colegioId.invalid
          ) {
            <span class="crear-hijo__error">Elegí un colegio.</span>
          }
        </label>

        <label class="crear-hijo__field crear-hijo__field--full">
          <span class="crear-hijo__label">Grado</span>
          <select
            formControlName="gradoId"
            [attr.disabled]="
              !form.controls.colegioId.value ||
              presenter.cargandoGrados() ||
              presenter.grados().length === 0
                ? true
                : null
            "
          >
            <option value="" disabled>
              @if (!form.controls.colegioId.value) {
                Elegí primero un colegio
              } @else if (presenter.cargandoGrados()) {
                Cargando grados...
              } @else if (presenter.grados().length === 0) {
                Sin grados disponibles
              } @else {
                Elegí un grado
              }
            </option>
            @for (grado of presenter.grados(); track grado.id) {
              <option [value]="grado.id">{{ grado.nombre }}</option>
            }
          </select>
          @if (form.controls.gradoId.touched && form.controls.gradoId.invalid) {
            <span class="crear-hijo__error">Elegí un grado.</span>
          }
        </label>
      </div>

      @if (presenter.error()) {
        <p class="crear-hijo__error-banner" role="alert">
          {{ presenter.error() }}
        </p>
      }

      <div class="crear-hijo__actions">
        @if (tieneHijos()) {
          <button
            type="button"
            class="crear-hijo__btn crear-hijo__btn--secundario"
            (click)="onCancelar()"
            [disabled]="presenter.guardando()"
          >
            Cancelar
          </button>
        }
        <button
          type="submit"
          class="crear-hijo__btn crear-hijo__btn--primario"
          [disabled]="presenter.guardando()"
        >
          @if (presenter.guardando()) {
            <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
            Creando...
          } @else {
            Crear hijo
          }
        </button>
      </div>
    </form>
  </div>
</main>
