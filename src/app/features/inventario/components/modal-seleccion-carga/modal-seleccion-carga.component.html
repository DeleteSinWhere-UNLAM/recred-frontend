<div
  class="modal-seleccion-carga__backdrop"
  tabindex="0"
  role="button"
  (click)="onCancel()"
  (keydown.enter)="onCancel()"
  (keydown.space)="onCancel()"
>
  <section
    class="modal-seleccion-carga"
    role="dialog"
    aria-modal="true"
    aria-labelledby="upload-selection-title"
    tabindex="-1"
    (click)="$event.stopPropagation()"
    (keydown.enter)="$event.stopPropagation()"
    (keydown.space)="$event.stopPropagation()"
  >
    <header class="modal-seleccion-carga__header">
      <div>
        <h3 id="upload-selection-title" class="modal-seleccion-carga__titulo">
          Nuevo producto
        </h3>
        <p class="modal-seleccion-carga__subtitle">
          Elige cómo deseas agregar productos al inventario
        </p>
      </div>
      <button
        type="button"
        class="modal-seleccion-carga__close"
        (click)="onCancel()"
        aria-label="Cerrar"
      >
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </header>

    <div class="modal-seleccion-carga__body">
      <button
        type="button"
        class="modal-seleccion-carga__option"
        (click)="onIndividualUpload()"
      >
        <div class="modal-seleccion-carga__icon" aria-hidden="true">
          <i class="fa-solid fa-box"></i>
        </div>
        <div class="modal-seleccion-carga__text">
          <strong class="modal-seleccion-carga__option-title">Carga individual</strong>
          <span class="modal-seleccion-carga__option-desc">Carga un producto a la vez mediante un formulario simple</span>
        </div>
        <i class="fa-solid fa-chevron-right modal-seleccion-carga__chevron" aria-hidden="true"></i>
      </button>

      <button
        type="button"
        class="modal-seleccion-carga__option"
        (click)="onBulkUpload()"
      >
        <div class="modal-seleccion-carga__icon" aria-hidden="true">
          <i class="fa-solid fa-boxes-stacked"></i>
        </div>
        <div class="modal-seleccion-carga__text">
          <strong class="modal-seleccion-carga__option-title">Carga masiva</strong>
          <span class="modal-seleccion-carga__option-desc">Sube un archivo PDF o Excel para procesar múltiples productos a la vez</span>
        </div>
        <i class="fa-solid fa-chevron-right modal-seleccion-carga__chevron" aria-hidden="true"></i>
      </button>
    </div>
  </section>
</div>
