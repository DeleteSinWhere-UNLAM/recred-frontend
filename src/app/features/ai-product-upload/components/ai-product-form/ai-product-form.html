<form [formGroup]="productForm" (ngSubmit)="submitForm()" class="product-form">
  <div class="form-grid">
    <div class="form-group">
      <label for="nombre">Nombre del Producto</label>
      <input id="nombre" formControlName="nombre" type="text" placeholder="Ej: Galletas de arroz">
    </div>
    
    <div class="form-group">
      <label for="marca">Marca</label>
      <input id="marca" formControlName="marca" type="text" placeholder="Ej: Tía Maruca">
    </div>
    
    <div class="form-group">
      <label for="peso">Peso / Volumen</label>
      <input id="peso" formControlName="peso" type="text" placeholder="Ej: 100g">
    </div>

    <div class="form-group options-group">
      <label>¿Contiene Azúcar?</label>
      <select formControlName="contiene_azucar" id="contiene_azucar">
        <option value="si">Sí</option>
        <option value="no">No</option>
      </select>
    </div>

    <div class="form-group options-group">
      <label>¿Contiene Lactosa?</label>
      <select formControlName="contiene_lactosa" id="contiene_lactosa">
        <option value="si">Sí</option>
        <option value="no">No</option>
      </select>
    </div>

    <div class="form-group options-group">
      <label>¿Contiene Maní?</label>
      <select formControlName="contiene_mani" id="contiene_mani">
        <option value="si">Sí</option>
        <option value="no">No</option>
      </select>
    </div>
  </div>

  <button type="submit" [disabled]="productForm.invalid" class="submit-btn">Guardar Producto</button>
</form>
