<form [formGroup]="productForm" (ngSubmit)="submitForm()" class="product-form">
  <div class="form-section">
    <h3 class="form-section__title">Información del Producto</h3>
    <div class="form-grid">
      <div class="form-group">
        <label for="nombre">Nombre del Producto</label>
        <input id="nombre" formControlName="nombre" type="text" placeholder="Ej: Manzana Roja">
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción</label>
        <input id="descripcion" formControlName="descripcion" type="text" placeholder="Ej: Manzana roja fresca por unidad">
      </div>

      <div class="form-group" [class.form-group--error]="hasError('categoriaId')">
        <label for="prod-categoria">Categoría</label>
        <select id="prod-categoria" formControlName="categoriaId">
          <option [ngValue]="null" disabled selected>Selecciona una categoría</option>
          @for (cat of categories; track cat.id) {
            <option [value]="cat.id">{{ cat.descripcion }}</option>
          }
          <option value="NEW">➕ Crear nueva categoría</option>
        </select>
        @if (hasError('categoriaId')) {
          <span class="form-error">{{ getErrorMessage('categoriaId') }}</span>
        }
      </div>

      @if (productForm.get('categoriaId')?.value === 'NEW') {
        <div class="form-group" [class.form-group--error]="hasError('nuevaCategoriaNombre')">
          <label for="prod-nueva-categoria">Nombre de la nueva categoría</label>
          <input id="prod-nueva-categoria" formControlName="nuevaCategoriaNombre" type="text" placeholder="Ej: Frutas y Verduras">
          @if (hasError('nuevaCategoriaNombre')) {
            <span class="form-error">{{ getErrorMessage('nuevaCategoriaNombre') }}</span>
          }
        </div>
      }

      <div class="form-group">
        <label for="peso">Peso (kg)</label>
        <input id="peso" formControlName="peso" type="number" step="0.001" min="0" placeholder="Ej: 0.150">
      </div>

      <div class="form-group">
        <label for="precio">Precio ($)</label>
        <input id="precio" formControlName="precio" type="number" step="0.01" min="0" placeholder="Ej: 800.00">
      </div>

      <div class="form-group">
        <label for="stockActual">Stock Actual</label>
        <input id="stockActual" formControlName="stockActual" type="number" min="0" placeholder="Ej: 120">
      </div>
    </div>
  </div>

  <div class="form-section">
    <h3 class="form-section__title">Opciones</h3>
    <div class="toggles-grid">
      <label class="toggle-item">
        <span class="toggle-item__label">Requiere Preparación</span>
        <input type="checkbox" formControlName="requierePreparacion">
        <span class="toggle-item__switch"></span>
      </label>

      <label class="toggle-item">
        <span class="toggle-item__label">Contiene Azúcar</span>
        <input type="checkbox" formControlName="contiene_azucar">
        <span class="toggle-item__switch"></span>
      </label>

      <label class="toggle-item">
        <span class="toggle-item__label">Contiene Maní</span>
        <input type="checkbox" formControlName="contiene_mani">
        <span class="toggle-item__switch"></span>
      </label>

      <label class="toggle-item">
        <span class="toggle-item__label">Contiene Lactosa</span>
        <input type="checkbox" formControlName="contiene_lactosa">
        <span class="toggle-item__switch"></span>
      </label>

      <label class="toggle-item">
        <span class="toggle-item__label">Contiene TACC</span>
        <input type="checkbox" formControlName="contiene_tacc">
        <span class="toggle-item__switch"></span>
      </label>
    </div>
  </div>

  <button type="submit" [disabled]="productForm.invalid || isSaving" class="submit-btn">
    @if (isSaving) {
      <span class="submit-btn__spinner"></span>
      Guardando...
    } @else {
      Guardar Producto
    }
  </button>
</form>
