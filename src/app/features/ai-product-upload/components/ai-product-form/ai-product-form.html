<form [formGroup]="productForm" (ngSubmit)="submitForm()">
      <div class="form-group">
        <label for="nombre">Nombre del Producto</label>
        <input id="nombre" formControlName="nombre" type="text">
      </div>
      
      <div class="form-group">
        <label for="marca">Marca</label>
        <input id="marca" formControlName="marca" type="text">
      </div>
      
      <div class="form-group">
        <label for="categoria">Categoría</label>
        <input id="categoria" formControlName="categoria" type="text">
      </div>

      <button type="submit" [disabled]="productForm.invalid">Guardar en Base de Datos</button>
    </form>
