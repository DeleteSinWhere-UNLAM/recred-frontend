<app-navbar [userName]="nombreUsuario" />

<main class="restricciones">
  <button
    type="button"
    class="restricciones__volver"
    (click)="presenter.volver()"
  >
    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
    <span>Volver</span>
  </button>

  <div class="restricciones__container">
    <section class="restricciones__panel" aria-labelledby="restricciones-titulo">
      <header class="restricciones__cabecera">
        <div class="restricciones__avatar" aria-hidden="true">
          <span>{{ presenter.iniciales() }}</span>
        </div>
        <div class="restricciones__identidad">
          <h2 id="restricciones-titulo" class="restricciones__titulo">Restricciones</h2>
          <p class="restricciones__subtitulo">
            {{ presenter.nombreCompleto() }}
            @if (presenter.grado()) {
              <span aria-hidden="true"> · </span>{{ presenter.grado() }}
            }
          </p>
        </div>
      </header>

      <ul class="restricciones__lista" role="list">
        @for (descriptor of presenter.catalogo; track descriptor.clave) {
          <li class="restriccion-item">
            <div
              class="restriccion-item__icono"
              [class]="'restriccion-item__icono--' + descriptor.colorIcono"
              aria-hidden="true"
            >
              <i class="fa-solid {{ descriptor.icono }}"></i>
            </div>

            <div class="restriccion-item__texto">
              <p class="restriccion-item__titulo">{{ descriptor.titulo }}</p>
              <p class="restriccion-item__descripcion">{{ descriptor.descripcion }}</p>
            </div>

            <label class="toggle">
              <input
                type="checkbox"
                class="toggle__input"
                [checked]="presenter.restricciones()[descriptor.clave]"
                (change)="presenter.alternar(descriptor.clave)"
                [attr.aria-label]="descriptor.titulo"
              />
              <span class="toggle__slider" aria-hidden="true"></span>
            </label>
          </li>
        }
      </ul>

      <button
        type="button"
        class="restricciones__guardar"
        (click)="presenter.guardar()"
      >
        Guardar Cambios
      </button>
    </section>
  </div>
</main>
