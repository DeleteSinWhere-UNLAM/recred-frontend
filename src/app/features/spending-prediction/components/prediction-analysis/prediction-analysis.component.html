<div class="prediction-analysis">
  <div class="analysis-section categories-section">
    <h3 class="section-title">Categorías Más Consumidas</h3>
    <div class="categories-list" *ngIf="categoriasMasConsumidas && categoriasMasConsumidas.length > 0">
      <span class="category-tag" *ngFor="let cat of categoriasMasConsumidas">
        {{ cat }}
      </span>
    </div>
    <div class="empty-state" *ngIf="!categoriasMasConsumidas || categoriasMasConsumidas.length === 0">
      No hay suficientes datos de categorías para mostrar.
    </div>
  </div>

  <div class="analysis-section" *ngIf="analisisIa">
    <div class="ia-header">
      <h3 class="section-title">Análisis de IA</h3>
      <span class="ia-model">Modelo: {{ analisisIa.modelo }}</span>
    </div>

    <p class="ia-summary">{{ analisisIa.resumen }}</p>

    <div class="ia-alerts" *ngIf="analisisIa.alertas && analisisIa.alertas.length > 0">
      <h4 class="subsection-title alerts-title">Alertas</h4>
      <ul class="alerts-list">
        <li *ngFor="let alerta of analisisIa.alertas">{{ alerta }}</li>
      </ul>
    </div>
    
    <div class="ia-recommendations" *ngIf="analisisIa.recomendaciones && analisisIa.recomendaciones.length > 0">
      <h4 class="subsection-title rec-title">Recomendaciones</h4>
      <ul class="rec-list">
        <li *ngFor="let rec of analisisIa.recomendaciones">{{ rec }}</li>
      </ul>
    </div>
  </div>

  <div class="empty-state" *ngIf="!analisisIa">
    No hay un análisis disponible en este momento.
  </div>
</div>
