<section class="colegio-section" [attr.aria-label]="colegio.nombre">
  <div class="colegio-section__sidebar" [class.colegio-section__sidebar--colapsado]="!expandido()">
    <button 
      type="button"
      class="colegio-section__sidebar-header" 
      (click)="toggle()"
      [attr.aria-expanded]="expandido()"
      [attr.aria-controls]="'colegio-' + colegio.id + '-content'"
    >
      <span class="colegio-section__icono" aria-hidden="true">
        <i class="fa-solid fa-school"></i>
      </span>
      <div class="colegio-section__header-text">
        <h2 class="colegio-section__nombre">{{ colegio.nombre }}</h2>
        <span class="colegio-section__alumnos-count">
          <i class="fa-solid fa-users-line" aria-hidden="true"></i>
          {{ alumnos.length }} {{ alumnos.length === 1 ? 'alumno' : 'alumnos' }}
        </span>
      </div>
      <span class="colegio-section__chevron" aria-hidden="true" [class.colegio-section__chevron--rotado]="expandido()">
        <i class="fa-solid fa-chevron-down"></i>
      </span>
    </button>
    
    @if (expandido()) {
      <div class="colegio-section__sidebar-body" [id]="'colegio-' + colegio.id + '-content'">
        

        <div class="colegio-section__content">
          <div class="colegio-section__grid">
            @for (alumno of alumnos; track alumno.id) {
              <app-alumno-card [alumno]="alumno" />
            }
          </div>
        </div>
      </div>
    }
  </div>
</section>
