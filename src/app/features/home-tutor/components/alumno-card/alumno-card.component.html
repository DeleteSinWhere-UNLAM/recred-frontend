<article class="alumno-card">
  <header class="alumno-card__header">
    <div class="alumno-card__identidad">
      <div class="alumno-card__avatar-wrap" [attr.aria-label]="'Avatar de ' + nombreCompleto">
        <div class="alumno-card__avatar">
          <span>{{ iniciales }}</span>
        </div>
      </div>
      <div class="alumno-card__texto">
        <h3 class="alumno-card__nombre">{{ nombreCompleto }}</h3>
        <p class="alumno-card__grado">
          <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
          {{ alumno.grado }}
        </p>
      </div>
    </div>

    <div class="alumno-card__saldo" [class.alumno-card__saldo--negativo]="saldoNegativo">
      <span class="alumno-card__saldo-label">
        <i class="fa-solid fa-wallet" aria-hidden="true"></i>
        Saldo
      </span>
      <span class="alumno-card__saldo-valor">{{ saldoFormateado }}</span>
    </div>
  </header>

  <div class="alumno-card__acciones" role="group" aria-label="Acciones rápidas">
    <button type="button" class="alumno-card__accion alumno-card__accion--menta">
      <span class="alumno-card__accion-icono" aria-hidden="true">
        <i class="fa-solid fa-plus"></i>
      </span>
      <span class="alumno-card__accion-label">Acreditar</span>
    </button>
    <a class="alumno-card__accion alumno-card__accion--melocoton" [routerLink]="['/restricciones-nutricionales', alumno.id]">
      <span class="alumno-card__accion-icono" aria-hidden="true">
        <i class="fa-solid fa-shield-halved"></i>
      </span>
      <span class="alumno-card__accion-label">Restricciones</span>
    </a>
    <a class="alumno-card__accion alumno-card__accion--dorado" [routerLink]="['/presupuesto', alumno.id]">
      <span class="alumno-card__accion-icono" aria-hidden="true">
        <i class="fa-solid fa-piggy-bank"></i>
      </span>
      <span class="alumno-card__accion-label">Presupuesto</span>
    </a>
    <a class="alumno-card__accion alumno-card__accion--pizarra" [routerLink]="['/estadistica', alumno.id]">
      <span class="alumno-card__accion-icono" aria-hidden="true">
        <i class="fa-solid fa-chart-line"></i>
      </span>
      <span class="alumno-card__accion-label">Estadística</span>
    </a>
  </div>

  <nav class="alumno-card__config" aria-label="Configuración">
    <button type="button" class="alumno-card__config-link">
      <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
      <span>Pendientes</span>
    </button>
    <button type="button" class="alumno-card__config-link">
      <i class="fa-solid fa-list" aria-hidden="true"></i>
      <span>Movimientos</span>
    </button>
    <a class="alumno-card__config-link" [routerLink]="['/prediccion-gasto', alumno.id]">
      <i class="fa-solid fa-chart-pie" aria-hidden="true"></i>
      <span>Predicción</span>
    </a>
  </nav>

  <a class="alumno-card__cta" [routerLink]="['/buffet', alumno.id]">
    <i class="fa-solid fa-utensils" aria-hidden="true"></i>
    Ir al Buffet
  </a>
</article>
