<app-navbar [userName]="nombreUsuario()" />

<main class="home">
  <div class="home__container">
    <app-tutor-header
      [iniciales]="inicialesTutor()"
      [nombreCompleto]="nombreCompletoTutor()"
      [urlFotoPerfil]="urlFotoPerfilTutor()"
      [cantidadHijos]="cantidadHijos()"
      [cantidadColegios]="cantidadColegios()"
      [saldoTotalFormateado]="saldoTotalFormateado()"
      [saldoTotalNegativo]="saldoTotalNegativo()"
    />

    <a routerLink="/resumen-semanal" class="home__resumen-card">
      <div class="home__resumen-card-content">
        <div class="home__resumen-card-icon" aria-hidden="true">
          <i class="fa-solid fa-chart-pie"></i>
        </div>
        <span>Conoce tu resumen semanal</span>
      </div>
      <i class="fa-solid fa-arrow-right home__resumen-card-arrow" aria-hidden="true"></i>
    </a>

    <div class="home__subtitulo-row">
      <h2 class="home__subtitulo">Alumnos asignados</h2>
      <button class="btn-secundario" (click)="irACrearHijo()">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
        Agregar Alumno
      </button>
    </div>

    @if (cargando()) {
      <div class="home__estado">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <p>Cargando información...</p>
      </div>
    } @else if (error()) {
      <div class="home__estado">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <p>{{ error() }}</p>
      </div>
    } @else if (colegios().length === 0) {
      <div class="home__estado">
        <i class="fa-solid fa-graduation-cap"></i>
        <p>Aún no tienes alumnos asignados a tu cuenta.</p>
      </div>
    } @else {
      <div class="home__master-detail">
        <div class="home__sidebar">
          @for (col of colegios(); track col.colegioId) {
            <app-colegio-section
              [colegioNombre]="col.colegioNombre"
              [alumnos]="col.alumnos"
              (onAdelanto)="manejarMicrocredito($event)"
            />
          }
        </div>
        <div class="home__content">
          <router-outlet></router-outlet>
        </div>
      </div>
    }
  </div>
</main>
