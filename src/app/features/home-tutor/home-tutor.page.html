<app-navbar [userName]="nombreUsuario()" />

<main class="home">
  <div class="home__container">
    <app-tutor-header
      [iniciales]="inicialesTutor()"
      [nombreCompleto]="nombreCompletoTutor()"
      [urlFotoPerfil]="urlFotoPerfilTutor()"
      [cantidadHijos]="cantidadHijos()"
      [cantidadColegios]="cantidadColegios()"
      [saldoTotalFormateado]="saldoTotalFormateado()"
      [saldoTotalNegativo]="saldoTotalNegativo()"
    />


    @if (cargando()) {
      <div class="home__estado">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <p>Cargando información...</p>
      </div>
    } @else if (error()) {
      <div class="home__estado">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <p>{{ error() }}</p>
      </div>
    } @else if (grupos().length === 0) {
      <div class="home__estado">
        <i class="fa-solid fa-graduation-cap"></i>
        <p>Aún no tienes alumnos asignados a tu cuenta.</p>
      </div>
    } @else {
      <div class="home__master-detail">
        <div class="home__sidebar">
          @for (grupo of grupos(); track grupo.colegio.id) {
            <app-colegio-section
              [colegio]="grupo.colegio"
              [alumnos]="grupo.alumnos"
              (onAdelanto)="manejarMicrocredito($event)"
            />
          }
        </div>
        <div class="home__content">
          <router-outlet></router-outlet>
        </div>
      </div>
    }
  </div>
</main>
