<app-navbar [userName]="nombreUsuario()" />

<main class="home">
  <div class="home__container">
    <app-tutor-header
      [iniciales]="inicialesTutor()"
      [nombreCompleto]="nombreCompletoTutor()"
      [urlFotoPerfil]="urlFotoPerfilTutor()"
      [cantidadHijos]="cantidadHijos()"
      [cantidadColegios]="cantidadColegios()"
      [saldoTotalFormateado]="saldoTotalFormateado()"
      [saldoTotalNegativo]="saldoTotalNegativo()"
    />

    <a routerLink="/resumen-semanal" class="home__resumen-card">
      <div class="home__resumen-card-content">
        <div class="home__resumen-card-icon" aria-hidden="true">
          <i class="fa-solid fa-chart-pie"></i>
        </div>
        <span>Conoce tu resumen semanal</span>
      </div>
      <i class="fa-solid fa-arrow-right home__resumen-card-arrow" aria-hidden="true"></i>
    </a>

    <div class="home__subtitulo-row">
      <h2 class="home__subtitulo">
        <span class="home__subtitulo-icono" aria-hidden="true">
          <i class="fa-solid fa-user-group"></i>
        </span>
        <span>Mis hijos</span>
      </h2>
      <a
        routerLink="/crear-hijo"
        class="home__agregar-hijo"
        aria-label="Agregar un nuevo hijo"
      >
        <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
        <span>Agregar hijo</span>
      </a>
    </div>

    <div class="home__sections" [class.home__sections--horizontal]="todosColegiosCerrados()">
      @for (grupo of grupos(); track grupo.colegio.id) {
        <app-colegio-section
          [colegio]="grupo.colegio"
          [alumnos]="grupo.alumnos"
          [expandido]="isColegioExpandido(grupo.colegio.id)"
          (toggleExpandido)="toggleColegio(grupo.colegio.id)"
        />
      }
    </div>
  </div>
</main>
