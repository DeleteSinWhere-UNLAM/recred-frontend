<app-navbar [userName]="nombreUsuario()" class="sticky top-0 z-50 block" />

<main class="flex-1 py-5 max-sm:pb-8 bg-[var(--color-fondo)] flex flex-col overflow-hidden max-lg:overflow-visible">
  <div class="w-full max-w-[1600px] mx-auto px-6 max-sm:px-4 flex flex-col gap-5 max-sm:gap-6 flex-1 min-h-0 max-lg:min-h-max">
    <app-tutor-header
      [iniciales]="inicialesTutor()"
      [nombreCompleto]="nombreCompletoTutor()"
      [urlFotoPerfil]="urlFotoPerfilTutor()"
      [cantidadHijos]="cantidadHijos()"
      [cantidadColegios]="cantidadColegios()"
      [saldoTotalFormateado]="saldoTotalFormateado()"
      [saldoTotalNegativo]="saldoTotalNegativo()"
    />


    @if (cargando()) {
      <div class="home__estado">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <p>Cargando información...</p>
      </div>
    } @else if (error()) {
      <div class="home__estado">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <p>{{ error() }}</p>
      </div>
    } @else if (grupos().length === 0) {
      <div class="home__estado">
        <i class="fa-solid fa-graduation-cap"></i>
        <p>Aún no tienes alumnos asignados a tu cuenta.</p>
      </div>
    } @else {
      <div class="grid grid-cols-[480px_1fr] max-lg:grid-cols-1 gap-8 max-sm:gap-6 items-stretch flex-1 min-h-0 max-lg:min-h-max overflow-hidden max-lg:overflow-visible">
        <div class="flex flex-col gap-6 overflow-y-auto max-lg:overflow-visible pr-2" style="scrollbar-width: none;">
          @for (grupo of grupos(); track grupo.colegio.id) {
            <app-colegio-section
              [colegio]="grupo.colegio"
              [alumnos]="grupo.alumnos"
              (onAdelanto)="manejarMicrocredito($event)"
            />
          }
        </div>
        <div class="rounded-[20px] shadow-[var(--shadow-card)] h-full max-lg:h-auto flex flex-col overflow-hidden max-lg:overflow-visible p-2 pr-0 max-sm:min-h-[300px] max-sm:p-1 max-sm:pr-0 bg-[var(--color-superficie)]">
          <div class="flex-1 overflow-y-auto max-lg:overflow-visible p-4 pl-6 pr-4 max-sm:p-3 max-sm:pl-4 flex flex-col custom-scrollbar">
            <router-outlet></router-outlet>
          </div>
        </div>
      </div>
    }
  </div>
</main>
