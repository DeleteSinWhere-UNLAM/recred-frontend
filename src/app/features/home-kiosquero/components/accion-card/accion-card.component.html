<button
  type="button"
  class="accion-card"
  [class.accion-card--pizarra]="accion.color === 'pizarra'"
  [class.accion-card--menta]="accion.color === 'menta'"
  [class.accion-card--dorado]="accion.color === 'dorado'"
  [class.accion-card--melocoton]="accion.color === 'melocoton'"
  [class.accion-card--violeta]="accion.color === 'violeta'"
  [attr.aria-label]="accion.titulo + ': ' + accion.descripcion"
  (click)="onClick()"
>
  <span class="accion-card__icono" aria-hidden="true">
    <i class="fa-solid {{ accion.icono }}"></i>
  </span>

  <span class="accion-card__contenido">
    <span class="accion-card__titulo-container">
      <strong class="accion-card__titulo">{{ accion.titulo }}</strong>
      @if (accion.premium) {
        <span class="accion-card__premium-badge">AVANZADO</span>
      }
    </span>
    <span class="accion-card__descripcion">{{ accion.descripcion }}</span>
  </span>

  <span class="accion-card__flecha" aria-hidden="true">
    <i class="fa-solid fa-arrow-right"></i>
  </span>
</button>
