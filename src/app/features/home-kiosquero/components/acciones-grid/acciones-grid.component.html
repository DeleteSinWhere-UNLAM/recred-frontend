<section class="acciones-grid" aria-label="Acciones rápidas">
  @for (accion of acciones; track accion.id) {
    <app-accion-card
      class="acciones-grid__item"
      [class.acciones-grid__item--full]="accion.destacada"
      [accion]="accion"
      [destacada]="accion.destacada ?? false"
      (seleccionar)="onSeleccionar($event)"
    />
  }
</section>
